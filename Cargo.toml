[package]
name = "blocks_not_included"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/sim", "crates/worldgen"]

[features]
default = ["dev"]
# For development builds: Bevy watches `assets/`, so editing the simulation's data files changes
# the running game (src/sim_files.rs). Build a release with `--no-default-features`.
dev = ["bevy/file_watcher"]

[dependencies]
bevy = { version = "0.20.1", features = ["dynamic_linking"] }
# The god tools' palette. Only what drawing it needs: no clipboard, URL opening, bevy_ui ordering
# or picking.
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
binary-greedy-meshing = "0.6.4"
# World saves (`src/saves/`): the checksum and compression of a save's body. Bevy's PNG support
# depends on both already.
crc32fast = "1.5.5"
# Channels to and from the simulation thread; see `src/sim_bridge.rs` for why not `std::sync::mpsc`.
crossbeam-channel = "0.5.17"
flate2 = "1.1.11"
ron = "0.12.3"
# The header of a World save, written as RON.
serde = { version = "1.0.229", features = ["derive"] }
sim = { path = "crates/sim" }
worldgen = { path = "crates/worldgen" }

# Where Windows keeps Local App Data, for World saves and settings (`src/user_dirs.rs`).
[target.'cfg(windows)'.dependencies]
known-folders = "1.4.2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# The same for the simulation and world generation, which `"*"` misses as workspace members. At
# opt-level 1 a Tick of the generated world takes about 110 ms of its 200 ms, and a busy one
# would overrun.
[profile.dev.package.sim]
opt-level = 3

[profile.dev.package.worldgen]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
